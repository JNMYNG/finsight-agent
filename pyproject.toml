[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "finsight"
version = "0.1.0"
description = "Evidence-preserving financial comparison using OpenDART"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<0.29",
    "python-dotenv>=1.0,<2",
    "defusedxml>=0.7.1,<0.8",
    "langgraph>=1.0,<2",
    "openai>=2,<3",
    "pydantic>=2.10,<3",
    "chromadb>=1.0,<2",
    "beautifulsoup4>=4.13,<5",
    "streamlit>=1.66,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[project.scripts]
finsight = "finsight.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/finsight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["finsight"]
branch = true
